<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071514"><title>WEST CURRENCY LIVING</title>
<style>
:root{--bg:#071514;--panel:#102421;--panel2:#17312d;--ink:#f2fbf8;--muted:#9bb7ae;--line:#25453e;--accent:#36d6ae;--accent2:#80f0d1;--danger:#ff7777;--shadow:0 12px 35px #0005}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body.light{--bg:#eef6f3;--panel:#fff;--panel2:#e1f0eb;--ink:#10241f;--muted:#58736a;--line:#c9ddd5;--accent:#087f65;--accent2:#0a9a79;--shadow:0 10px 28px #183b2d18}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:11px 15px;background:var(--accent);color:#05251c;font-weight:750}button.secondary{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button:active{transform:scale(.98)}input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:5px 0 12px}label{display:block;color:var(--muted);font-size:13px}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.brand{font-weight:900;letter-spacing:.13em}.accent{color:var(--accent2)}.landing{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:26px;max-width:540px;margin:auto;text-align:center}.mark{width:70px;height:70px;border:1px solid var(--accent);border-radius:22px;display:grid;place-items:center;color:var(--accent);font-size:27px;font-weight:900;margin-bottom:18px;box-shadow:0 0 40px #36d6ae22}.landing h1{font-size:clamp(25px,7vw,38px);line-height:1.1;margin:0}.landing p{color:var(--muted);margin:12px 0 28px}.landing .fields{width:100%;text-align:left}.actions{display:flex;gap:10px;width:100%;margin-top:8px}.actions button{flex:1}.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}.top .brand{font-size:13px}.shell{max-width:1100px;margin:auto;padding:16px 14px 90px}.welcome{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.welcome h2{margin:0;font-size:22px}.chips{display:flex;gap:8px;overflow:auto;padding:5px 0 13px}.chip{white-space:nowrap;padding:8px 12px;border-radius:30px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:13px}.chip.active{background:var(--accent);color:#05251c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.card img{width:100%;height:145px;object-fit:cover;display:block;background:var(--panel2)}.cardbody{padding:11px}.card h3{margin:0 0 5px;font-size:15px}.price{color:var(--accent2);font-weight:850}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.card button{padding:8px 10px;font-size:12px}.section-title{margin:22px 0 10px;font-size:18px}.notice{padding:12px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);margin:12px 0}.feed{display:grid;gap:14px}.post{height:min(72svh,690px);min-height:440px;position:relative;border-radius:20px;overflow:hidden;background:#132d28}.post>img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.post:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#000c)}.postinfo{position:absolute;z-index:1;bottom:15px;left:15px;right:15px;color:white}.postinfo p{margin:5px 0}.postinfo button{margin-top:6px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--panel2);border-radius:13px;padding:12px}.stat strong{display:block;font-size:21px;color:var(--accent2)}.list{display:grid;gap:9px}.item{padding:12px;border-radius:13px;background:var(--panel2);display:flex;justify-content:space-between;align-items:center;gap:8px}.bottom{position:fixed;z-index:15;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));overflow:auto}.bottom button{background:transparent;color:var(--muted);padding:7px 9px;font-size:11px;min-width:55px}.bottom button.active{color:var(--accent2)}.bottom span{display:block;font-size:19px}.modal{position:fixed;inset:0;z-index:30;background:#0009;display:grid;place-items:end center;padding:12px}.modalbox{width:min(100%,520px);max-height:88svh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.toast{position:fixed;z-index:50;bottom:90px;left:50%;transform:translateX(-50%);background:var(--accent);color:#05251c;padding:10px 16px;border-radius:30px;font-weight:700;box-shadow:var(--shadow)}.mapfake{height:240px;border-radius:16px;background:linear-gradient(35deg,#163a32,#24483d 45%,#18362f);position:relative;overflow:hidden;display:grid;place-items:center;text-align:center;color:#d6fff1}.mapfake:before{content:"";position:absolute;inset:-30%;background:repeating-linear-gradient(25deg,transparent 0 35px,#ffffff14 36px 39px),repeating-linear-gradient(115deg,transparent 0 50px,#ffffff10 51px 54px);transform:rotate(-8deg)}.mapfake>*{z-index:1}.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:#36d6ae22;color:var(--accent2)}@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.shell{padding-top:24px}.post{height:650px}.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<section id="landing" class="landing"><div class="mark">WC</div><div class="brand accent">WEST CURRENCY</div><h1>WEST CURRENCY<br><span class="accent">LIVING</span></h1><p>Your Neighbourhood. Your Marketplace. Your Community.</p><div class="fields"><label>Country</label><select id="country"><option>Kenya</option><option>Uganda</option><option>Tanzania</option><option>Rwanda</option><option>Nigeria</option><option>South Africa</option><option>United States</option><option>United Kingdom</option><option>United Arab Emirates</option><option>India</option><option>Other country</option></select><label>Your location</label><input id="location" placeholder="e.g. Kasarani, Nairobi"><button class="secondary" style="width:100%;margin-bottom:10px" onclick="getLocation()">◎ Use my current location</button></div><div class="actions"><button onclick="auth('Sign in')">Sign in</button><button class="secondary" onclick="auth('Create account')">Sign up</button></div><p class="small" style="margin-top:22px">POWERFUL BEHIND THE SCENES. SIMPLE IN PEOPLE'S HANDS.</p></section>
<div id="app" class="hidden"><header class="top"><div class="brand">WEST CURRENCY <span class="accent">LIVING</span></div><div class="row"><span id="userloc" class="small muted">Kenya</span><button class="ghost" onclick="toggleTheme()" aria-label="Toggle theme">◐</button></div></header><main class="shell"><div class="welcome"><div><div class="small muted">WELCOME TO YOUR COMMUNITY</div><h2 id="pageTitle">Discover</h2></div><button class="secondary" onclick="openModal('Quick action',quickForm())">＋ Create</button></div><div id="content"></div></main><nav class="bottom" id="nav"></nav></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle">Details</h3><button class="ghost" onclick="closeModal()">✕</button></div><div id="modalContent"></div></div></div><div id="toast" class="toast hidden"></div>
<script>
const products=[['Fresh farm tomatoes','KSh 80 / kg','Fresh produce','https://images.unsplash.com/photo-1546094096-0df4bcaaa337?w=800'],['Homemade vanilla cake','KSh 1,200','Home kitchen','https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=800'],['Classic sneakers','KSh 2,800','Fashion','https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800'],['Wireless headphones','KSh 1,950','Electronics','https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800'],['Organic vegetables box','KSh 650','Farm fresh','https://images.unsplash.com/photo-1540420773420-3366772f4999?w=800'],['Handmade sofa','KSh 18,000','Furniture','https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=800'],['Leather handbag','KSh 3,400','Fashion','https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=800'],['Fresh bread pack','KSh 250','Bakery','https://images.unsplash.com/photo-1509440159596-0249088772ff?w=800'],['Smart watch','KSh 3,999','Electronics','https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800'],['Potted indoor plant','KSh 700','Home & garden','https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=800'],['Farm eggs tray','KSh 480','Groceries','https://images.unsplash.com/photo-1506976785307-8732e854ad03?w=800'],['Custom gift hamper','KSh 2,500','Gifts','https://images.unsplash.com/photo-1513201099705-a9746e1e201f?w=800']];
const businesses=[['Mama Njeri Fresh Market','Groceries · Kasarani','Open now'],['Clay City Barber Studio','Barber · Clay City','Open now'],['Seasons Family Kitchen','Restaurant · Seasons','Demo listing'],['Westlands Auto Care','Vehicle services · Nairobi','Demo listing'],['Green Basket Farm','Farm produce · Kiambu','Open now'],['Bright Spark Electricals','Home services · Nairobi','Verified demo']];
const services=[['Plumbing','Repairs and installations','From KSh 800'],['House cleaning','One-off or recurring','From KSh 1,000'],['Laundry & ironing','Pickup and delivery','From KSh 300'],['Electrician','Wiring and troubleshooting','From KSh 1,000'],['Tutoring','School and skills support','Agree rate'],['Moving & delivery','Bike, van and lorry options','Request quote']];
const people=['Amina W.','Brian K.','Mercy N.','Kevin M.','Joyce A.','Daniel T.','Faith C.','Peter O.','Lilian S.','Sam K.'];let users=Array.from({length:1200},(_,i)=>({name:people[i%people.length]+' '+(Math.floor(i/10)+1),area:['Kasarani','Seasons','Clay City','Roysambu','Nairobi CBD','Westlands'][i%6]}));
let orders=[],reservations=[],sales=[],bookings=[],posts=[];let page='Discover';let countryName='Kenya';
const tabs=[['Discover','⌂'],['Shop','▦'],['Reels','▶'],['Near me','◎'],['Services','✦'],['Business','▤'],['Community','♡'],['Profile','◉']];
function init(){document.getElementById('nav').innerHTML=tabs.map(([t,ic])=>`<button id="tab-${t}" onclick="go('${t}')"><span>${ic}</span>${t}</button>`).join('');}
function auth(mode){countryName=document.getElementById('country').value;let loc=document.getElementById('location').value.trim()||'Location not set';document.getElementById('userloc').textContent=loc+' · '+countryName;document.getElementById('landing').classList.add('hidden');document.getElementById('app').classList.remove('hidden');toast(mode==='Sign in'?'Demo sign-in successful':'Demo account created');go('Discover')}
function go(p){page=p;document.getElementById('pageTitle').textContent=p;tabs.forEach(([t])=>document.getElementById('tab-'+t).classList.toggle('active',t===p));render()}
function render(){let c=document.getElementById('content');if(page==='Discover')c= c, c.innerHTML=discover();else if(page==='Shop')c.innerHTML=shop();else if(page==='Reels')c.innerHTML=reels();else if(page==='Near me')c.innerHTML=near();else if(page==='Services')c.innerHTML=servicePage();else if(page==='Business')c.innerHTML=businessPage();else if(page==='Community')c.innerHTML=community();else c.innerHTML=profile();}
function discover(){return `<div class="panel"><div class="row"><div><div class="small muted">YOUR LOCAL NETWORK</div><h2 style="margin:3px 0">Discover what's happening</h2><div class="muted small">Products, people, services and opportunities around you.</div></div><span class="pill">DEMO LIVE</span></div></div><div class="chips"><button class="chip active" onclick="go('Shop')">Shop nearby</button><button class="chip" onclick="go('Reels')">Watch Reels</button><button class="chip" onclick="go('Services')">Find a service</button><button class="chip" onclick="go('Near me')">Explore map</button></div><h3 class="section-title">Popular near you</h3><div class="grid">${products.slice(0,4).map(productCard).join('')}</div><h3 class="section-title">Neighbourhood businesses</h3><div class="list">${businesses.slice(0,3).map(b=>`<div class="item"><div><b>${b[0]}</b><div class="small muted">${b[1]}</div></div><button class="secondary" onclick="toast('Demo business profile opened')">View</button></div>`).join('')}</div><div class="notice">Demo environment: sample listings and activity are illustrative, not real sellers or live stock.</div>`}
function productCard(p){return `<article class="card"><img src="${p[3]}" alt="${p[0]}" onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=800'"><div class="cardbody"><div class="small muted">${p[2]}</div><h3>${p[0]}</h3><div class="row"><span class="price">${p[1]}</span><button onclick="addOrder('${p[0]}','${p[1]}')">Add</button></div></div></article>`}
function shop(){return `<div class="chips"><button class="chip active">For you</button><button class="chip" onclick="toast('Category filter: groceries')">Groceries</button><button class="chip" onclick="toast('Category filter: fashion')">Fashion</button><button class="chip" onclick="toast('Category filter: home')">Home</button><button class="chip" onclick="toast('Category filter: electronics')">Electronics</button></div><div class="row"><span class="muted small">${products.length} featured demo products</span><button class="secondary" onclick="openModal('Post a product',productForm())">＋ Sell item</button></div><div class="grid" style="margin-top:12px">${products.map(productCard).join('')}</div><h3 class="section-title">Your basket <span class="pill">${orders.length} items</span></h3>${orders.length?`<div class="list">${orders.map(o=>`<div class="item"><span>${o.name}<br><small class="muted">${o.price}</small></span><button class="ghost" onclick="removeOrder(${o.id})">Remove</button></div>`).join('')}</div><button style="width:100%;margin-top:12px" onclick="checkout()">Continue to demo checkout</button>`:'<div class="notice">Add a product to start a demo basket.</div>'}`}
function reels(){let arr=[['Fresh food from your neighbourhood','https://images.unsplash.com/photo-1540420773420-3366772f4999?w=1000','Green Basket Farm'],['A little style for every day','https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1000','Amina Styles'],['Made fresh, made with care','https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=1000','Seasons Family Kitchen']];return `<div class="feed">${arr.map((p,i)=>`<div class="post"><img src="${p[1]}" alt="Creator post"><div class="postinfo"><b>@${p[2].replaceAll(' ','').toLowerCase()}</b><p>${p[0]}</p><div class="row"><span>♡ ${120+i*37} · ↗ ${24+i*8}</span><button onclick="toast('Demo creator followed')">Follow</button></div><button class="secondary" onclick="go('Shop')">View products</button></div></div>`).join('')}</div><div class="notice">Sample creator content. Swipe down to explore more posts.</div>`}
function near(){return `<div class="mapfake"><div><div style="font-size:36px">◎</div><b>WEST CURRENCY WORLD MAP</b><p class="small">Illustrative demo map · ${document.getElementById('userloc').textContent}</p><button onclick="getLocation()">Use my location</button></div></div><div class="panel"><h3>Explore by distance</h3><div class="chips"><button class="chip" onclick="toast('Showing 100 metres')">100 m</button><button class="chip active" onclick="toast('Showing 1 kilometre')">1 km</button><button class="chip" onclick="toast('Showing 5 kilometres')">5 km</button><button class="chip" onclick="toast('Showing 10 kilometres')">10 km</button></div><label>Search this area</label><input id="nearSearch" placeholder="e.g. cakes, vegetables, plumber"><button onclick="toast('Demo search: '+(document.getElementById('nearSearch').value||'all nearby listings'))">Search nearby</button></div><h3 class="section-title">Nearby demo listings</h3><div class="list">${businesses.map(b=>`<div class="item"><div><b>${b[0]}</b><div class="small muted">${b[1]}</div></div><span class="pill">${b[2]}</span></div>`).join('')}</div>`}
function servicePage(){return `<div class="panel"><h3>Find trusted help</h3><p class="muted small">Browse local service providers or request a quote.</p><input id="serviceSearch" placeholder="What do you need help with?"><button onclick="toast('Searching demo providers')">Find a provider</button></div><div class="grid">${services.map(s=>`<div class="card"><div class="cardbody"><span class="pill">SERVICE</span><h3 style="margin-top:8px">${s[0]}</h3><div class="muted small">${s[1]}</div><p class="price">${s[2]}</p><button onclick="openModal('Request '+ '${s[0]}',requestForm('${s[0]}'))">Request service</button></div></div>`).join('')}</div>`}
function businessPage(){return `<div class="stats"><div class="stat"><strong>${orders.length}</strong><span class="small muted">Demo orders</span></div><div class="stat"><strong>${reservations.length}</strong><span class="small muted">Reservations</span></div><div class="stat"><strong>${sales.length}</strong><span class="small muted">Sales entries</span></div><div class="stat"><strong>1,200+</strong><span class="small muted">Sample members</span></div></div><div class="panel"><h3>Business workspace</h3><div class="row"><button onclick="openModal('Add reservation',reservationForm())">＋ Reservation</button><button class="secondary" onclick="openModal('Record sale',saleForm())">＋ Record sale</button></div><div class="row" style="margin-top:10px"><button class="secondary" onclick="openModal('Add menu item',productForm())">＋ Add product</button><button class="secondary" onclick="openModal('Business profile',businessForm())">Edit profile</button></div></div><h3 class="section-title">Recent reservations</h3><div class="list">${reservations.length?reservations.map(r=>`<div class="item"><span>${r.name}<br><small class="muted">${r.date} · ${r.guests} guests</small></span><span class="pill">Demo pending</span></div>`).join(''):'<div class="notice">No reservations yet. Add a demo reservation above.</div>'}</div><h3 class="section-title">Orders</h3><div class="list">${orders.length?orders.map(o=>`<div class="item">${o.name}<span class="pill">Basket</span></div>`).join(''):'<div class="notice">Customer orders will appear here in this browser demo.</div>'}</div>`}
function community(){return `<div class="panel"><h3>Good Deeds & Kindness</h3><p class="muted">Offer food, clothing, skills, transport or other support to people in your community.</p><button onclick="openModal('Offer help',goodForm())">Offer help</button> <button class="secondary" onclick="toast('Demo requests loaded')">Browse requests</button></div><div class="panel"><h3>Events & tickets</h3><p class="muted">Discover local events and demo ticket experiences.</p><div class="item"><span><b>Nairobi Community Connect</b><br><small class="muted">Community meetup · Demo event</small></span><button onclick="toast('Demo ticket reserved')">Get ticket</button></div></div><div class="panel"><h3>Talent bookings</h3><p class="muted">Send a booking enquiry to an artist, DJ, MC or creator.</p><button onclick="openModal('Talent booking request',bookingForm())">Request a booking</button></div><div class="panel"><h3>Community feedback</h3><button class="secondary" onclick="openModal('Submit a demo complaint',complaintForm())">Submit feedback / complaint</button></div>`}
function profile(){return `<div class="panel"><div class="row"><div><div class="mark" style="width:54px;height:54px;margin:0">WC</div></div><div style="flex:1"><h3 style="margin:0">Demo Member</h3><div class="muted small">${document.getElementById('userloc').textContent}</div></div><span class="pill">DEMO</span></div></div><div class="stats"><div class="stat"><strong>${orders.length}</strong><span class="small muted">Basket items</span></div><div class="stat"><strong>${bookings.length}</strong><span class="small muted">Booking requests</span></div><div class="stat"><strong>10%</strong><span class="small muted">Referral rate demo</span></div><div class="stat"><strong>1,200+</strong><span class="small muted">Sample users</span></div></div><div class="panel"><h3>Referral programme</h3><p class="muted small">Demo referral code: WCL-DEMO-2026. Real commissions are not active in this prototype.</p><button onclick="copyText('https://westcurrencyliving.github.io/west-currency-livingg/?ref=WCL-DEMO-2026')">Copy demo referral link</button></div><div class="panel"><h3>Account</h3><button class="secondary" onclick="toggleTheme()">Switch theme</button> <button class="ghost" onclick="signout()">Sign out</button></div><div class="notice">This is a local browser demo. Profile details and activity are not connected to a live account.</div>`}
function quickForm(){return `<div class="list"><button onclick="openModal('Post a product',productForm())">Sell a product</button><button class="secondary" onclick="openModal('Request a service',requestForm('General service'))">Request a service</button><button class="secondary" onclick="openModal('Talent booking',bookingForm())">Book talent</button></div>`}
function productForm(){return `<form onsubmit="event.preventDefault();toast('Demo listing saved');closeModal()"><label>Product name</label><input required placeholder="What are you selling?"><label>Price</label><input required placeholder="e.g. KSh 500"><label>Category</label><select><option>Groceries</option><option>Fashion</option><option>Home</option><option>Electronics</option><option>Other</option></select><label>Photo URL (optional)</label><input placeholder="Image link"><button>Save demo listing</button></form>`}
function requestForm(s){return `<form onsubmit="event.preventDefault();toast('Demo request sent');closeModal()"><p class="muted small">${s}</p><label>Describe what you need</label><textarea required placeholder="Add details, location and preferred time"></textarea><label>Budget (optional)</label><input placeholder="Your budget"><button>Send demo request</button></form>`}
function reservationForm(){return `<form onsubmit="event.preventDefault();reservations.push({name:this.guest.value,date:this.date.value,guests:this.guests.value});closeModal();render();toast('Demo reservation added')"><label>Guest name</label><input name="guest" required><label>Date and time</label><input name="date" type="datetime-local" required><label>Number of guests</label><input name="guests" type="number" min="1" value="2"><button>Add reservation</button></form>`}
function saleForm(){return `<form onsubmit="event.preventDefault();sales.push({amount:this.amount.value,item:this.item.value});closeModal();render();toast('Demo sale recorded')"><label>Item or service</label><input name="item" required><label>Amount (KSh)</label><input name="amount" type="number" min="1" required><button>Record demo sale</button></form>`}
function businessForm(){return `<form onsubmit="event.preventDefault();toast('Demo business profile saved');closeModal()"><label>Business name</label><input required placeholder="Business name"><label>Business category</label><input placeholder="e.g. Restaurant"><label>Location</label><input placeholder="Area / town"><button>Save profile</button></form>`}
function bookingForm(){return `<form onsubmit="event.preventDefault();bookings.push(this.talent.value);closeModal();toast('Demo booking enquiry sent')"><label>Artist / talent</label><input name="talent" required placeholder="Artist, DJ, MC or creator"><label>Event date</label><input type="date" required><label>Venue and event details</label><textarea required placeholder="Venue, event type, expected audience"></textarea><label>Proposed budget</label><input placeholder="Your budget"><button>Send booking enquiry</button></form>`}
function goodForm(){return `<form onsubmit="event.preventDefault();toast('Demo kindness offer published');closeModal()"><label>What can you offer?</label><input required placeholder="Food, clothes, skill, transport..."><label>Area</label><input placeholder="Your neighbourhood"><label>Details</label><textarea placeholder="Describe your offer"></textarea><button>Publish demo offer</button></form>`}
function complaintForm(){return `<form onsubmit="event.preventDefault();toast('Demo feedback saved locally; not sent to an authority');closeModal()"><label>Organisation or subject</label><input required><label>What happened?</label><textarea required></textarea><label>Privacy</label><select><option>Confidential demo</option><option>Anonymous demo</option></select><button>Save demo report</button></form>`}
function addOrder(name,price){orders.push({id:Date.now()+Math.random(),name,price});toast(name+' added to basket')}
function removeOrder(id){orders=orders.filter(o=>o.id!==id);render();toast('Removed from basket')}
function checkout(){openModal('Demo checkout',`<p class="muted">Choose a simulated payment method. No money will be charged.</p><div class="list">${['M-PESA (demo)','Visa / Mastercard (demo)','Bank transfer (demo)','Cash on delivery (demo)'].map(x=>`<button class="secondary" onclick="closeModal();toast('${x} selected — no payment taken')">${x}</button>`).join('')}</div><div class="notice">This prototype does not connect to payment providers or process real payments.</div>`)}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2400)}
function toggleTheme(){document.body.classList.toggle('light');toast(document.body.classList.contains('light')?'Light theme':'Dark theme')}
function getLocation(){if(!navigator.geolocation){toast('Location is not supported on this device');return}toast('Requesting location permission');navigator.geolocation.getCurrentPosition(p=>{let v=p.coords.latitude.toFixed(3)+', '+p.coords.longitude.toFixed(3);document.getElementById('location').value=v;document.getElementById('userloc').textContent=v+' · '+countryName;toast('Location added to this demo')},()=>toast('Location not shared. You can type your area instead.'),{enableHighAccuracy:false,timeout:10000})}
function copyText(s){if(navigator.clipboard){navigator.clipboard.writeText(s).then(()=>toast('Copied')).catch(()=>toast(s))}else toast(s)}
function signout(){document.getElementById('app').classList.add('hidden');document.getElementById('landing').classList.remove('hidden')}
init();
</script></body></html>
